services:
  postgres:
    image: postgres:15-alpine
    container_name: agent-postgres
    environment:
      POSTGRES_DB: agent_system
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_system"]
      interval: 5s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    container_name: agent-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent_password@postgres:5432/agent_system
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WORKSPACE_DIR: /app/workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://aicredits.in/v1}
      DEFAULT_OPENAI_MODEL: ${DEFAULT_OPENAI_MODEL:-gpt-5-mini}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RESEARCH_MAX_ITERATIONS: ${RESEARCH_MAX_ITERATIONS:-2}
      RESEARCH_MAX_TOOL_CALLS: ${RESEARCH_MAX_TOOL_CALLS:-8}
      RESEARCH_MAX_SECONDS: ${RESEARCH_MAX_SECONDS:-180}
      RESEARCH_MAX_REPEAT_STEPS: ${RESEARCH_MAX_REPEAT_STEPS:-1}
      COSTS_DIR: /app/costs
      SHARED_WORKSPACE: /app/workspace/shared
      ENABLE_SHELL: "false"
      ENABLE_PYTHON_EXECUTOR: "true"
      SANDBOX_DIR: /app/sandbox
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./workspace:/app/workspace
      - ./sandbox:/app/sandbox
      - ./traces:/app/traces
      - ./costs:/app/costs
      - ./evaluation_results:/app/evaluation_results
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
  qdrant_data:
